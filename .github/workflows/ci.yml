name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: pytest -q
      - name: Figure manifest check
        run: |
          python scripts/figures/figure_manifest.py --check \
            || echo "manifest 校验失败（图未重导出或输入已变化，需在本地重跑批次脚本）"
