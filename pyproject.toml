[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evcs-station-graph"
version = "0.1.0"
description = "站内充电单元交互图与事件残差修正研究代码"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 本地影子决策层；不改变原模型训练依赖。
decision = ["scipy>=1.11"]
# 传统基线（scripts/run_traditional_baselines.py：Persistence/ARIMA/LightGBM/XGBoost）
# 服务器 Python 3.8 需安装兼容版本：lightgbm 4.x / xgboost 2.x / statsmodels 0.14.x
baselines = ["statsmodels>=0.14", "lightgbm>=4.0", "xgboost>=2.0"]

[project.scripts]
evcs-sg = "evcs_station_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 同时支持 scripts.*、独立脚本模块和 src 布局；测试收集不依赖调用者的 PYTHONPATH。
pythonpath = [".", "src", "scripts"]
