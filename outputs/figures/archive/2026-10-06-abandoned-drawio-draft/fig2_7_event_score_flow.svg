<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="896" viewBox="0 0 1040 896" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="35" text-anchor="start" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44" font-weight="700">冻结规则事件窗口：分数、阈值与执行</text>
<text x="42" y="69" text-anchor="start" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#68757D">训练段估计逐节点标准差；验证段冻结非零分数95%分位阈值；测试段只应用规则</text>
<rect x="42" y="120" width="260" height="80" rx="20" fill="#E8EFF3" stroke="#56798E" stroke-width="1.5"/>
<text x="172" y="160" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">接入数 · 离站数
|活跃变化| · |负荷变化|</text>
<rect x="42" y="230" width="260" height="76" rx="20" fill="#E8EFF3" stroke="#56798E" stroke-width="1.5"/>
<text x="172" y="268" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">逐节点标准差归一化
σ 仅由训练段估计</text>
<rect x="42" y="340" width="260" height="76" rx="20" fill="#E8EFF3" stroke="#56798E" stroke-width="1.5"/>
<text x="172" y="378" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">四分量求和
当前分数 q(t,i)</text>
<rect x="370" y="120" width="260" height="80" rx="20" fill="#F2EAE3" stroke="#A08B7D" stroke-width="1.5"/>
<text x="500" y="160" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">验证段：筛选 q(t,i)&gt;0</text>
<rect x="370" y="230" width="260" height="76" rx="20" fill="#E8EFF3" stroke="#56798E" stroke-width="1.5"/>
<text x="500" y="268" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">逐节点计算95%分位数</text>
<rect x="370" y="340" width="260" height="76" rx="38" fill="#F2EAE3" stroke="#A08B7D" stroke-width="1.5"/>
<text x="500" y="378" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44" font-weight="700">冻结阈值 θᵢ</text>
<polygon points="500,470 580,520 500,570 420,520" fill="#FBF5E9" stroke="#B39A61" stroke-width="1.5"/>
<text x="500" y="520" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="10" fill="#303C44" font-weight="700">q(t,i) &gt; θᵢ ?</text>
<rect x="105" y="635" width="330" height="70" rx="20" fill="#E8EFF3" stroke="#56798E" stroke-width="1.5"/>
<text x="270" y="670" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">是：记录触发点 t
并向未来扩展2步</text>
<rect x="585" y="635" width="310" height="70" rx="20" fill="#F3F5F6" stroke="#BAC2C7" stroke-width="1.5"/>
<text x="740" y="670" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44">否：该起点不触发</text>
<rect x="105" y="750" width="420" height="68" rx="34" fill="#F2EAE3" stroke="#A08B7D" stroke-width="1.5"/>
<text x="315" y="784" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#303C44" font-weight="700">合并段内相邻或重叠窗口
输出冻结规则事件窗口</text>
<line x1="172" y1="160" x2="172" y2="268" stroke="#56798E" stroke-width="2" marker-end="url(#arrow-block)" style="color: #56798E" fill="none"/>
<line x1="172" y1="268" x2="172" y2="378" stroke="#56798E" stroke-width="2" marker-end="url(#arrow-block)" style="color: #56798E" fill="none"/>
<line x1="500" y1="160" x2="500" y2="268" stroke="#56798E" stroke-width="2" marker-end="url(#arrow-block)" style="color: #56798E" fill="none"/>
<line x1="500" y1="268" x2="500" y2="378" stroke="#56798E" stroke-width="2" marker-end="url(#arrow-block)" style="color: #56798E" fill="none"/>
<line x1="172" y1="378" x2="500" y2="520" stroke="#56798E" stroke-width="2" marker-end="url(#arrow-block)" style="color: #56798E" fill="none"/>
<line x1="500" y1="378" x2="500" y2="520" stroke="#A08B7D" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-block)" style="color: #A08B7D" fill="none"/>
<line x1="500" y1="520" x2="270" y2="670" stroke="#2C5F8A" stroke-width="2" marker-end="url(#arrow-block)" style="color: #2C5F8A" fill="none"/>
<line x1="500" y1="520" x2="740" y2="670" stroke="#858D92" stroke-width="2" marker-end="url(#arrow-block)" style="color: #858D92" fill="none"/>
<line x1="270" y1="670" x2="315" y2="784" stroke="#2C5F8A" stroke-width="2" marker-end="url(#arrow-block)" style="color: #2C5F8A" fill="none"/>
<text x="336" y="437" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="11" fill="#616161">当前 q(t,i)</text>
<text x="518" y="449" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="11" fill="#616161">冻结 θᵢ</text>
<text x="385" y="583" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="11" fill="#616161">是</text>
<text x="620" y="583" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="11" fill="#616161">否</text>
</svg>