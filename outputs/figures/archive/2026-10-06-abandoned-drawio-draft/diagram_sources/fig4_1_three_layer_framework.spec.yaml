meta:
  profile: "academic-paper"
  figureType: "workflow"
  source: "edited"
  theme: "academic-color"
  layout: "horizontal"
  canvas: "1000x710"
  routing: "orthogonal"
  title: "三层机制诊断协议（MDP）"
  description: "按L1干预归因、L2蒸馏验证和L3四格溯源呈现逐层证据与判定边界。"
  legend: "横向箭头只连接同一行的诊断问题、操作、证据与判定。"
  font:
    primary: "Times New Roman"
    cjk: "Songti SC"
    formula: "Times New Roman"
  replication:
    colorMode: preserve-original
    background: "#FFFFFF"
    palette:
      - hex: "#E8EFF3"
        role: "主体流程节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#F2EAE3"
        role: "数据与结果节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#FBF5E9"
        role: "判断节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#56798E"
        role: "主流程连线"
        appliesTo: edges
        confidence: high
    confidenceNotes:
      - "保留论文蓝灰、暖灰色彩语义；重画节点、箭头与文字，不沿用旧图的像素几何。"

