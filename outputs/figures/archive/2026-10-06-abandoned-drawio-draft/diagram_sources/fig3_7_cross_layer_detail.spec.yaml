meta:
  profile: "academic-paper"
  figureType: "architecture"
  source: "edited"
  theme: "academic-color"
  layout: "horizontal"
  canvas: "1020x750"
  routing: "orthogonal"
  title: "跨层表示路径与预测头"
  description: "显示两层传播、残差精炼的输入关系及跨层拼接内容。"
  legend: "箭头表示张量传递；跨层拼接不含精炼状态H⁽¹,ref⁾。"
  font:
    primary: "Times New Roman"
    cjk: "Songti SC"
    formula: "Times New Roman"
  replication:
    colorMode: preserve-original
    background: "#FFFFFF"
    palette:
      - hex: "#E8EFF3"
        role: "主体流程节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#F2EAE3"
        role: "数据与结果节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#FBF5E9"
        role: "判断节点填充"
        appliesTo: nodes
        confidence: high
      - hex: "#56798E"
        role: "主流程连线"
        appliesTo: edges
        confidence: high
    confidenceNotes:
      - "保留论文蓝灰、暖灰色彩语义；重画节点、箭头与文字，不沿用旧图的像素几何。"

nodes:
