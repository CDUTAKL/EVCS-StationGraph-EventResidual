experiment_id: SG-EXP-005
name: frozen_event_gated_residual_correction
status: ready_after_SG-EXP-002_checkpoint
model: event_residual
gate:
  type: validation_frozen
  enabled: true
formula: final_prediction = base_prediction + gate * clipped_local_residual
purpose: 仅在事件窗口内利用站内相关节点和历史相似模式修正残差
seeds: [2024, 2025, 2026]
result_authority: formal_candidate
model_params:
  hidden_dim: 32
  levels: 6
  dropout: 0.1
  residual_hidden_dim: 32
  residual_bound: 0.5
  freeze_base: true
  # 底座为 AdaptiveGraph（night_run 20260730-171821 实际口径，B6 最优底座）；
  # 未声明时默认 temporal，与底座 checkpoint 结构不匹配会导致 strict 加载崩溃
  base_model_type: adaptive_graph
training:
  epochs: 40
  patience: 6
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
graph:
  top_k: 5
